<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>CRUCIBLE - A Chymical Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@500;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="frame">
  <div id="stage">
    <canvas id="scene" width="960" height="600"></canvas>

    <!-- Top HUD -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-plate">
          <div class="hud-avatar" id="hudAvatar"></div>
          <div class="hud-meta">
            <div class="hud-name" id="hudName">Adept</div>
            <div class="hud-bar hp"><span id="hudHpFill"></span><b id="hudHpText">0/0</b></div>
            <div class="hud-bar xp"><span id="hudXpFill"></span><b id="hudXpText">Lv 1</b></div>
          </div>
        </div>
      </div>
      <div class="hud-right">
        <div class="coin-plate"><i class="ic-coin"></i><span id="hudGold">0</span></div>
        <button class="iconbtn" id="btnMenu" title="Menu (Esc)">&#9776;</button>
      </div>
    </div>

    <!-- Bottom toolbar (overworld) -->
    <div id="toolbar" class="hidden">
      <button class="tool" data-act="map"><span>World Map</span></button>
      <button class="tool" data-act="familiars"><span>Familiars</span></button>
      <button class="tool" data-act="character"><span>Character</span></button>
      <button class="tool" data-act="bag"><span>Satchel</span></button>
    </div>

    <!-- Generic banner toast -->
    <div id="toast" class="hidden"></div>

    <!-- Overlay host: screens get injected here -->
    <div id="overlay" class="hidden"></div>

    <!-- Dialogue box -->
    <div id="dialogue" class="hidden">
      <div class="speaker" id="dlgSpeaker"></div>
      <div class="dlgtext" id="dlgText"></div>
      <div class="dlgnext">click to continue &#9658;</div>
    </div>
  </div>
</div>

<div id="rotate">Please rotate your device to landscape.</div>

<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/chem.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/world.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
